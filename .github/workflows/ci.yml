# .github/workflows/ci.yml

name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip uv
        uv pip install --system -r requirements.txt
        uv pip install --system -e ".[airflow]"

    - name: Run data ingestion
      run: |
        python -m fraudshield.data_ingestion.data_ingestion

    - name: Run data preprocessing
      run: |
        python -m fraudshield.data_preprocessing.data_preprocessing

    - name: Train models
      run: |
        python -m fraudshield.model_training.train_models

    - name: Evaluate models
      run: |
        python -m fraudshield.model_evaluation.evaluation

    - name: Run tests
      run: |
        uv run pytest tests/ -v

    - name: Package project
      run: |
        python -m pip install build
        python -m build

    - name: Upload package artifacts
      uses: actions/upload-artifact@v6
      with:
        name: dist
        path: dist

  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip uv
        uv pip install --system "ruff>=0.11.0" "mypy>=1.10.0"
        uv pip install --system -r requirements.txt
        uv pip install --system -e .

    - name: Lint with Ruff
      run: |
        ruff check src tests

    - name: Type check with mypy
      run: |
        mypy src/

  deploy:
    needs: [build, lint]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v6

    - name: Download package artifacts
      uses: actions/download-artifact@v7
      with:
        name: dist
        path: dist

    - name: Publish to PyPI
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
      run: |
        python -m pip install twine
        python -m twine upload dist/*
