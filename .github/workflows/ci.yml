# .github/workflows/ci.yml

name: CI

on:
  push:
    branches: [ main, "version-*" ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: fraudshield
          POSTGRES_PASSWORD: fraudshield_password
          POSTGRES_DB: fraudshield_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.10"

    - name: Set up uv
      uses: astral-sh/setup-uv@v10.2.0
      with:
        enable-cache: true

    - name: Install dependencies
      run: |
        uv sync --all-extras --locked

    - name: Run data ingestion
      run: |
        uv run --no-sync python -m fraudshield.data_ingestion.data_ingestion

    - name: Run data preprocessing
      run: |
        uv run --no-sync python -m fraudshield.data_preprocessing.data_preprocessing

    - name: Train models
      run: |
        uv run --no-sync python -m fraudshield.model_training.train_models

    - name: Evaluate models
      run: |
        uv run --no-sync python -m fraudshield.model_evaluation.evaluation

    - name: Run tests
      env:
        FRAUDSHIELD_DATABASE_URL: postgresql+psycopg2://fraudshield:fraudshield_password@localhost:5432/fraudshield_db
      run: |
        uv run --no-sync pytest tests/ -v

    - name: Run component verification harness
      env:
        FRAUDSHIELD_DATABASE_URL: postgresql+psycopg2://fraudshield:fraudshield_password@localhost:5432/fraudshield_db
      run: |
        uv run --no-sync python scripts/verify_v3_components.py

    - name: Package project
      run: |
        uv run --no-sync python -m build

    - name: Upload package artifacts
      uses: actions/upload-artifact@v7
      with:
        name: dist
        path: dist

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.10"

    - name: Set up uv
      uses: astral-sh/setup-uv@v10.2.0
      with:
        enable-cache: true

    - name: Install dependencies
      run: |
        uv sync --all-extras --locked

    - name: Lint with Ruff
      run: |
        uv run --no-sync ruff check src tests scripts

    - name: Type check with mypy
      run: |
        uv run --no-sync mypy src/

  dependency-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.10"

    - name: Set up uv
      uses: astral-sh/setup-uv@v10.2.0
      with:
        enable-cache: true

    - name: Audit exported locked dependencies
      run: |
        uv export --all-extras --no-dev --no-emit-project --no-hashes --locked --output-file /tmp/fraudshield-audit-requirements.txt
        uvx pip-audit --no-deps --disable-pip -r /tmp/fraudshield-audit-requirements.txt --strict
