services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "127.0.0.1:2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  neo4j:
    image: neo4j:5.12.0
    ports:
      - "127.0.0.1:7474:7474" # HTTP
      - "127.0.0.1:7687:7687" # Bolt
    environment:
      NEO4J_AUTH: neo4j/${FRAUDSHIELD_NEO4J_PASSWORD:?Set FRAUDSHIELD_NEO4J_PASSWORD in .env}
    volumes:
      - neo4j_data:/data

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: fraudshield
      POSTGRES_PASSWORD: ${FRAUDSHIELD_POSTGRES_PASSWORD:?Set FRAUDSHIELD_POSTGRES_PASSWORD in .env}
      POSTGRES_DB: fraudshield_db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  fraudshield:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8000:8000" # FastAPI inference and /metrics
    depends_on:
      - kafka
      - neo4j
      - postgres
    environment:
      FRAUDSHIELD_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      FRAUDSHIELD_NEO4J_URI: bolt://neo4j:7687
      FRAUDSHIELD_NEO4J_PASSWORD: ${FRAUDSHIELD_NEO4J_PASSWORD:?Set FRAUDSHIELD_NEO4J_PASSWORD in .env}
      FRAUDSHIELD_DATABASE_URL: ${FRAUDSHIELD_DATABASE_URL:?Set FRAUDSHIELD_DATABASE_URL in .env}
      FRAUDSHIELD_MONITORING_ENABLED: "true"

  prometheus:
    image: prom/prometheus:v2.47.0
    ports:
      - "127.0.0.1:9091:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - fraudshield

  grafana:
    image: grafana/grafana:10.1.0
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${FRAUDSHIELD_GRAFANA_ADMIN_PASSWORD:?Set FRAUDSHIELD_GRAFANA_ADMIN_PASSWORD in .env}
    depends_on:
      - prometheus

volumes:
  neo4j_data:
  postgres_data:
