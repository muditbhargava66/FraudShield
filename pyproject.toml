[build-system]
requires = ["scikit-build-core>=0.4.3", "pybind11"]
build-backend = "scikit_build_core.build"

[project]
name = "fraudshield"
version = "2.3.0"
description = "Anomaly Detection Pipeline for Fraud Detection"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Mudit Bhargava", email = "muditbhargava666@gmail.com" }
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

dependencies = [
  "numpy",
  "pandas",
  "scikit-learn",
  "xgboost",
  "scipy",
  "matplotlib",
  "seaborn",
  "sqlalchemy",
  "psycopg2-binary",
  "joblib",
  "pybind11",
  "fastapi>=0.136.0",
  "uvicorn",
  "confluent-kafka",
  "pydantic",
  "neo4j",
  "shap",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.11.0",
  "tox>=4.24.0",
  "mypy>=1.10.0",
  "pytest>=9.0.3",
  "pytest-cov>=4.0.0",
]
airflow = [
  "apache-airflow>=3.2.2",
  "apache-airflow-providers-snowflake",
]

[project.scripts]
fraudshield_ingest = "fraudshield.data_ingestion.data_ingestion:main"
fraudshield_preprocess = "fraudshield.data_preprocessing.data_preprocessing:main"
fraudshield_train = "fraudshield.model_training.train_models:main"
fraudshield_evaluate = "fraudshield.model_evaluation.evaluation:main"

[tool.scikit-build]
wheel.packages = ["src/fraudshield"]
cmake.version = ">=3.15"

[tool.scikit-build.sdist]
include = ["src/fraudshield/sql/*.sql"]

# Pin vulnerable transitive dependencies to minimum safe versions.
# These are not directly imported but pulled in by direct dependencies.
[tool.uv]
override-dependencies = [
  "apache-airflow-providers-smtp>=3.0.0",
  "cryptography>=46.0.6",
  "idna>=3.15",
  "mako>=1.3.11",
  "pillow>=12.2.0",
  "pygments>=2.20.0",
  "pyopenssl>=26.0.0",
  "requests>=2.33.0",
  "starlette>=1.0.1",
  "urllib3>=2.7.0",
]

[tool.ruff]
line-length = 150
target-version = "py310"
extend-exclude = [
  ".airflow",
  "build",
  "data/models",
  "data/plots",
  "data/processed",
]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*.ipynb" = ["E402"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
ignore_missing_imports = true
disallow_untyped_defs = false
check_untyped_defs = true
exclude = [
  "build/",
  ".venv/",
  ".tox/",
  "tests/",
  "notebooks/",
]
