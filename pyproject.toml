[build-system]
requires = ["scikit-build-core>=0.4.3", "pybind11>=3.1.0,<3.2"]
build-backend = "scikit_build_core.build"

[project]
name = "fraudshield"
version = "4.0.0"
description = "Anomaly Detection Pipeline for Fraud Detection"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Mudit Bhargava", email = "muditbhargava666@gmail.com" }
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

dependencies = [
  "numpy",
  "pandas",
  "scikit-learn",
  "xgboost",
  "scipy",
  "matplotlib",
  "seaborn",
  "sqlalchemy",
  "psycopg2-binary",
  "joblib",
  "pybind11",
  "fastapi>=0.136.0",
  "uvicorn",
  "confluent-kafka",
  "pydantic",
  "neo4j",
  "shap",
  "prometheus_client>=0.21.0",
  "networkx>=3.2",
]

[project.optional-dependencies]
dev = [
  "build>=1.2.2",
  "ruff>=0.11.0",
  "tox>=4.24.0",
  "mypy>=1.10.0",
  "pytest>=9.0.3",
  "pytest-cov>=4.0.0",
  "httpx>=0.28.0",
]
airflow = [
  "apache-airflow>=3.3.2",
]

[project.scripts]
fraudshield_ingest = "fraudshield.data_ingestion.data_ingestion:main"
fraudshield_preprocess = "fraudshield.data_preprocessing.data_preprocessing:main"
fraudshield_train = "fraudshield.model_training.train_models:main"
fraudshield_evaluate = "fraudshield.model_evaluation.evaluation:main"

[tool.scikit-build]
wheel.packages = ["src/fraudshield"]
cmake.version = ">=3.15"

[tool.scikit-build.sdist]
include = ["src/fraudshield/sql/*.sql"]

# Pin vulnerable transitive dependencies to minimum safe versions.
# These are not directly imported but pulled in by direct dependencies.
[tool.uv]
# Platforms with prebuilt wheels for every package in the tree. Intel macOS is absent
# because numba and llvmlite have published arm64-only macOS wheels since 0.54 / 0.40,
# which left the resolver falling back to numba 0.53.1 for x86_64 Macs -- a release that
# requires Python < 3.10 and so cannot install under this project's floor at all.
environments = [
  "sys_platform == 'linux'",
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
  "sys_platform == 'win32'",
]
override-dependencies = [
  "aiosmtplib>=5.1.2",
  "anyio>=4.14.2",
  "apache-airflow-providers-smtp>=3.0.0",
  "certifi>=2026.10.18",
  "click>=8.3.3",
  "cryptography>=50.0.0",
  "dnspython>=2.9.2",
  "filelock>=4.2.1",
  "fsspec>=2026.6.0",
  "idna>=3.20",
  "mako>=1.4.2",
  "opentelemetry-api>=1.45.2",
  "pillow>=13.0.0",
  "pydantic-settings>=2.14.2",
  "pygments>=2.20.0",
  "pyjwt>=2.15.0",
  "requests>=2.33.0",
  "setuptools>=84.1.0",
  "sqlparse>=0.6.0",
  "starlette>=1.3.1",
  "urllib3>=2.8.0",
  "virtualenv>=21.14.9",
]

[tool.ruff]
line-length = 150
target-version = "py311"
extend-exclude = [
  ".airflow",
  "build",
  "data/models",
  "data/plots",
  "data/processed",
]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*.ipynb" = ["E402"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
ignore_missing_imports = true
disallow_untyped_defs = false
check_untyped_defs = true
exclude = [
  "build/",
  ".venv/",
  ".tox/",
  "tests/",
  "notebooks/",
]
