[tox]
requires = tox>=4.24
env_list = py310, py311, py312, py313, ruff
isolated_build = true
skip_missing_interpreters = true

[testenv]
description = Run the FraudShield test suite
deps =
    pytest>=8.0.0
    pytest-cov>=4.0.0
commands =
    pytest {posargs:tests}

[testenv:ruff]
description = Run Ruff lint and formatting checks
skip_install = true
deps =
    ruff>=0.11.0
commands =
    ruff check src tests scripts notebooks
    ruff format --check src tests scripts notebooks
