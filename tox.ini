[tox]
requires = tox>=4.24
env_list = py310, py311, py312, py313, ruff, mypy
isolated_build = true
skip_missing_interpreters = true

[testenv]
description = Run the FraudShield test suite
extras = dev
commands =
    pytest {posargs:tests}

[testenv:ruff]
description = Run Ruff lint checks
skip_install = true
deps =
    ruff>=0.11.0
commands =
    ruff check src tests

[testenv:mypy]
description = Run mypy type checking
extras = dev
deps =
    mypy>=1.10.0
commands =
    mypy src/
